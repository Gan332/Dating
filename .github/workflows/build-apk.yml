name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # ---- 验证阶段：不需要 Android SDK/NDK，先跑完，别让打包用的基础设施挡住回归 ----

      - name: Fetch Dart dependencies
        run: flutter pub get

      # Rust 日期核心的单元测试同样秒级，先于 Flutter/Gradle 阶段执行，让回归立刻暴露。
      - name: Rust unit tests
        run: cargo test --manifest-path rust/Cargo.toml

      # 早失败：先跑秒级的 Rust 核心测试，再跑语法/类型/lint，而不是等 Gradle 跑满几分钟。
      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      # ---- 打包阶段：以下步骤都要 Android 工具链，放在验证之后 ----
      #
      # 顺序刻意保持「先验证、后打包」：runner 镜像换版曾让 sdkmanager 从 PATH 上消失，
      # 那时 NDK 安装一挂，连 flutter analyze / flutter test 都轮不到跑，回归报告全丢。

      - name: Precache Flutter Android artifacts
        run: flutter precache --android || flutter precache

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          key: cargo-ndk

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install Android NDK
        run: |
          set -euo pipefail
          FLUTTER_BIN="$(readlink -f "$(command -v flutter)")"
          FLUTTER_ROOT="${FLUTTER_ROOT:-$(dirname "$(dirname "$FLUTTER_BIN")")}"
          EXT="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt"
          # flutter.ndkVersion is what android/app/build.gradle.kts asks AGP for.
          NDK_VERSION="$(grep -E '^[[:space:]]*(const[[:space:]]+)?val[[:space:]]+ndkVersion' "$EXT" 2>/dev/null \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)"
          if [ -z "$NDK_VERSION" ]; then
            NDK_VERSION="$(grep -m1 -oE 'ndkVersion[^0-9]*[0-9]+\.[0-9]+\.[0-9]+' "$EXT" 2>/dev/null \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)"
          fi
          NDK_VERSION="${NDK_VERSION:-28.2.13676358}"
          echo "Android NDK version required by Flutter: $NDK_VERSION"

          # SDK 根目录：环境变量优先，其次问 Flutter 自己，最后才猜常见路径。
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="$(flutter doctor -v 2>/dev/null | sed -n 's/.*Android SDK at \(.*\)$/\1/p' | head -n1 || true)"
          fi
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            for candidate in /usr/local/lib/android/sdk "$HOME/Android/Sdk" /opt/android-sdk /usr/lib/android-sdk; do
              if [ -d "$candidate" ]; then SDK_ROOT="$candidate"; break; fi
            done
          fi
          echo "Using Android SDK at: ${SDK_ROOT:-<not found>}"

          if [ -d "$SDK_ROOT/ndk/$NDK_VERSION" ]; then
            echo "NDK $NDK_VERSION already installed."
          else
            # sdkmanager 不一定在 PATH 上（runner 镜像换版会挪走它），自己找一遍。
            SDKMANAGER="$(command -v sdkmanager 2>/dev/null || true)"
            if [ -z "$SDKMANAGER" ] && [ -d "$SDK_ROOT/cmdline-tools" ]; then
              SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort | tail -n1 || true)"
            fi
            if [ -z "$SDKMANAGER" ] && [ -x "$SDK_ROOT/tools/bin/sdkmanager" ]; then
              SDKMANAGER="$SDK_ROOT/tools/bin/sdkmanager"
            fi
            if [ -z "$SDKMANAGER" ]; then
              echo "::error::找不到 sdkmanager，装不了 NDK $NDK_VERSION。SDK_ROOT=${SDK_ROOT:-<empty>}"
              ls -la "${SDK_ROOT:-/nonexistent}" 2>/dev/null || true
              ls -la "${SDK_ROOT:-/nonexistent}/cmdline-tools" 2>/dev/null || true
              exit 1
            fi
            echo "Using sdkmanager at: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "ndk;$NDK_VERSION"
          fi

          NDK_DIR="$SDK_ROOT/ndk/$NDK_VERSION"
          test -d "$NDK_DIR"
          echo "Using NDK at $NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Ensure Gradle wrapper is available
        run: |
          set -euo pipefail
          mkdir -p android/gradle/wrapper
          if [ -f android/gradlew ] && [ -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper already present."
          else
            # This repo intentionally does not track the wrapper; Flutter injects it during the
            # build from its cached artifact. Copy it up front so the build never has to guess.
            CACHE_DIR="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")/bin/cache/artifacts/gradle_wrapper"
            if [ -d "$CACHE_DIR" ]; then
              echo "Copying wrapper files from $CACHE_DIR"
              cp -r "$CACHE_DIR/." android/
            fi
            # Fallback: take the scripts and jar from a throwaway `flutter create` project.
            if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
              echo "Scaffolding a temporary project to obtain the Gradle wrapper"
              SCAFFOLD="$(mktemp -d)"
              flutter create --no-pub --platforms=android --project-name daymark --org com.example "$SCAFFOLD/app" > /dev/null
              cp "$SCAFFOLD/app/android/gradlew" "$SCAFFOLD/app/android/gradlew.bat" android/
              cp "$SCAFFOLD/app/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/
              rm -rf "$SCAFFOLD"
            fi
            # Never keep a copied gradle-wrapper.properties: Flutter writes the version that
            # matches this project's Android Gradle Plugin when the file is missing.
            rm -f android/gradle/wrapper/gradle-wrapper.properties
          fi
          chmod +x android/gradlew
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          echo "Gradle wrapper ready."

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # 一次构建同时产出 universal 与单 ABI 包（ABI 拆分配在 build.gradle.kts）。
      # --target-platform 限定引擎只打包 arm/arm64，否则 universal 会混进 x86_64（约 +20 MB）。
      - name: Build release APKs
        run: flutter build apk --release --target-platform android-arm,android-arm64

      # AAB：上架后由商店按设备 ABI/密度分发；arm + arm64 覆盖新旧设备。
      - name: Build App Bundle
        run: flutter build appbundle --release --target-platform android-arm,android-arm64

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: daymark-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: daymark-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
