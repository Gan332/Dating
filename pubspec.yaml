publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  intl: ^0.20.2
  lunar: ^1.7.8
  material_3_expressive: ^1.1.5
  material_ui: ^1.5.0
  shared_preferences: ^2.5.3
  sqflite: ^2.4.4
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
